<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Crab Code</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <canvas id="logo" width="88" height="88"></canvas>
      <div>
        <div class="brand-name">Crab Code</div>
        <div class="brand-sub">Rust 를 코드로 배우는 퍼즐</div>
      </div>
    </div>
    <nav id="chapters" aria-label="장 선택"></nav>
  </header>

  <main>
    <section class="column">
      <article id="lesson" class="panel">
        <div class="lesson-head">
          <span id="chapter-name"></span>
          <nav id="levels" aria-label="레벨 선택"></nav>
        </div>
        <h1 id="lesson-title"></h1>
        <div id="lesson-body"></div>
      </article>

      <div id="editor-panel" class="panel">
        <div class="tabbar">
          <div class="tab"><span class="tab-dot"></span>main.rs</div>
          <div class="tab-hint">Cmd+Enter 실행 · Cmd+/ 주석 · F1 명령 팔레트</div>
        </div>
        <div id="editor"></div>
      </div>

      <div class="buttons">
        <button id="run" class="primary">실행 (F5)</button>
        <button id="reset">처음 코드로</button>
        <button id="hint">힌트</button>
        <button id="solution">정답 보기</button>
      </div>
    </section>

    <section class="column">
      <div id="world-panel" class="panel">
        <div class="world-top">
          <div id="bag"></div>
          <button id="speed">속도 1x</button>
        </div>
        <div id="info"></div>
        <div id="world-wrap"><canvas id="world"></canvas></div>
        <div id="banner"></div>
      </div>

      <div id="console-panel" class="panel">
        <div class="panel-label">출력</div>
        <div id="console"></div>
      </div>
    </section>
  </main>

  <script src="vendor/monaco/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
